# Kurulum:
#   docker compose up -d      # panel http://127.0.0.1:8501
#
# .env İSTEĞE BAĞLI (varsayılanlar çalışır). LLM fallback'i açmak ya da
# saklama sürelerini değiştirmek istersen:  cp .env.example .env
#
# Veri toplama iki şekilde yapılabilir:
#   1) scheduler servisi (varsayılan, otomatik)  -> aşağıdaki 'scheduler'
#   2) elle tek seferlik: docker compose run --rm worker all

# Ayarların TAMAMI isteğe bağlı; her birinin makul bir varsayılanı var.
#
# NEDEN `env_file` DEĞİL: `env_file: - .env` yazıldığında dosya yoksa
# `docker compose up` hiç başlamadan "open .env: no such file" ile düşüyordu.
# Compose'un `required: false` biçimi ancak v2.24+ ile geldi; bu yüzden
# değişkenler burada `${VAR:-varsayılan}` ile geçiriliyor. Compose proje
# dizinindeki `.env` dosyasını değişken yerine koyma (interpolation) için
# ZATEN okuyor ve dosya yoksa hata vermiyor — yani `.env` varsa çalışır,
# yoksa da çalışır.
x-env: &env
  TZ: ${TZ:-Europe/Istanbul}
  LOG_DIR: ${LOG_DIR:-data/logs}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # LLM fallback varsayılan olarak KAPALI; anahtar girilse bile açıkça
  # açılmadıkça tek token harcanmaz.
  LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-0}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
  LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
  LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-8000}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2000}
  LLM_MAX_CALLS_PER_RUN: ${LLM_MAX_CALLS_PER_RUN:-1}
  # Agent toplayıcısı banka BAŞINA bir çağrı yapıyor; varsayılan 8, envanterdeki
  # aktif sayfa sayısından az. Geçirilmezse konteynerde ilk sekiz banka çekilir
  # ve gerisi sessizce eksik kalır — panelde hata da görünmez.
  LLM_AGENT_MAX_CALLS_PER_RUN: ${LLM_AGENT_MAX_CALLS_PER_RUN:-8}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
  # SAĞLAYICIYA ÖZEL EK GÖVDE — Qwen kurulumunda ZORUNLU.
  # Qwen'in OpenAI-uyumlu ucunda düşünme modu VARSAYILAN AÇIK; ölçüldü
  # (2026-09-02): aynı istek düşünme açıkken 1445, kapalıyken 41 çıktı tokeni.
  # Bu değişken geçirilmezse konteyner .env'deki {"enable_thinking": false}
  # ayarını GÖREMEZ ve her koşu otuz kat fazlaya mal olur. Üstelik akıl
  # yürütme tokenleri max_tokens bütçesini yiyip JSON'u yarıda kestiği için
  # çağrılar "yanıt ayrıştırılamadı" ile de düşebilir.
  LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
  # Boşsa maliyet "bilinmiyor" gösterilir; 0 yazmak "bedava" demek olurdu.
  LLM_PRICE_INPUT_PER_1M: ${LLM_PRICE_INPUT_PER_1M:-}
  LLM_PRICE_OUTPUT_PER_1M: ${LLM_PRICE_OUTPUT_PER_1M:-}
  CATCHUP_INTERVAL_MINUTES: ${CATCHUP_INTERVAL_MINUTES:-30}
  RUN_ON_START: ${RUN_ON_START:-1}
  # Kayıt budama (gün). 0 = sınırsız sakla. Bkz. store/retention.py.
  RETAIN_HTTP_REQUEST_DAYS: ${RETAIN_HTTP_REQUEST_DAYS:-30}
  RETAIN_SOURCE_RUN_DAYS: ${RETAIN_SOURCE_RUN_DAYS:-180}
  RETAIN_SCRAPE_RUN_DAYS: ${RETAIN_SCRAPE_RUN_DAYS:-180}
  RETAIN_SNAPSHOT_DAYS: ${RETAIN_SNAPSHOT_DAYS:-14}
  EVDS_API_KEY: ${EVDS_API_KEY:-}
  # Boş bırakılırsa store/db.py volume içindeki SQLite dosyasını kullanır.
  # .env'de tanımlıysa (ör. Postgres'e geçiş) konteynere de geçmeli, yoksa
  # panel ve zamanlayıcı AYRI veritabanlarına bakar.
  DB_URL: ${DB_URL:-}

services:
  panel:
    build: .
    image: finans-agent:latest
    container_name: finans-panel
    # Ayrı bir scheduler servisi olduğu için panel yalnızca paneldir.
    # Tek konteynerli kurulumda (compose'suz) ROLE varsayılanı 'all'dır.
    environment:
      <<: *env
      ROLE: panel
    ports:
      # Sadece localhost'a bağlanır. Dışarı açmak istersen "8501:8501" yap
      # ve ÖNÜNE bir reverse proxy + kimlik doğrulama koy — bu panelde
      # oturum yönetimi YOK, açan herkes görür.
      - "127.0.0.1:8501:8501"
    volumes:
      - finans-data:/app/data
    restart: unless-stopped

  # Sürekli çalışıp toplayıcıları zamanında tetikler (cron'a gerek yok).
  scheduler:
    build: .
    image: finans-agent:latest
    container_name: finans-scheduler
    volumes:
      - finans-data:/app/data
    environment: *env
    entrypoint: ["python", "-u", "scheduler.py"]
    restart: unless-stopped
    # Docker'ın varsayılan 10 saniyesi yetmiyor: SIGTERM geldiğinde
    # zamanlayıcı ELİNDEKİ toplayıcıyı bitirip çıkıyor (bkz. scheduler.py
    # _shutdown) ve VakıfBank mevduat matrisi tek başına ~60 sn sürüyor.
    # Süre kısa kalırsa işleyici hiçbir işe yaramaz, konteyner yine SIGKILL
    # ile yarıda kesilir.
    stop_grace_period: 90s
    # `depends_on: panel` KALDIRILDI: toplama panelin ayakta olmasına
    # bağlı değil. Panel sağlıksızsa zamanlayıcının da beklemesi, veriyi
    # tamamen alakasız bir sebeple durdururdu.
    # NEDEN AYRI BİR HEALTHCHECK: imajdaki HEALTHCHECK Streamlit'in
    # /_stcore/health ucunu yokluyor (bkz. Dockerfile). Bu konteynerde HTTP
    # sunucusu YOK — entrypoint scheduler.py. Devralınan komut bu yüzden her
    # turda curl(7) ile düşüyordu: konteyner veriyi sorunsuz toplarken Docker
    # onu ~110 sn sonra kalıcı olarak "unhealthy" (Docker Desktop'ta SARI)
    # işaretliyordu. Sürekli yanlış alarm, gerçek arızayı görünmez yapar.
    #
    # Doğru ölçüt zaten elimizde: zamanlayıcı 30 sn'de bir nabız atıyor ve
    # nabız 180 sn'den bayatsa süreç ölmüş sayılıyor (store/heartbeat.py).
    # host karşılaştırması nabzın BU konteynerden geldiğini doğrular; sağlık
    # komutu konteynerin içinde koştuğu için hostname aynıdır. Bu olmadan,
    # başka bir makinedeki canlı zamanlayıcının nabzı bu ölü konteyneri
    # sağlıklı gösterirdi.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket, sys; from store import heartbeat; s = heartbeat.read(); sys.exit(0 if s and s['alive'] and s['host'] == socket.gethostname() else 1)"]
      interval: 30s
      timeout: 15s
      # Nabız ayrı bir iş parçacığından atıldığı için açılıştaki uzun toplama
      # turunu beklemez (bkz. heartbeat.start_beating); 60 sn yalnızca
      # python/sqlalchemy açılış payı.
      start_period: 60s
      retries: 3

  # Elle çalıştırma: docker compose run --rm worker all
  worker:
    build: .
    image: finans-agent:latest
    volumes:
      - finans-data:/app/data
    environment: *env
    entrypoint: ["python", "worker.py"]
    profiles: ["tools"]
    # Tek seferlik iş — servis değil. İmajdaki Streamlit sağlık komutu burada
    # da anlamsız ve hep başarısız; kapatılmazsa `compose run` sırasında
    # konteyner boş yere "unhealthy" görünür.
    healthcheck:
      disable: true

volumes:
  # Adlandırılmış volume: bind mount'ta konteyner kullanıcısı (uid 10001)
  # host dizinine yazamayabiliyor.
  #
  # GERÇEK VOLUME ADI compose proje önekini taşır. Yedek almak için:
  #   docker run --rm -v finansalverihesaplamaajan_finans-data:/d \
  #     -v "$PWD":/b alpine tar czf /b/finans-data.tgz -C /d .
  # ("finans-data" diye yazmak BOŞ bir volume yaratıp onu yedekler.)
  #
  # VAR OLAN BİR VERİTABANINI TAŞIRKEN: kopyaladıktan sonra
  # `scheduler_heartbeat` satırını SİLİN.
  #   docker run --rm -v finansalverihesaplamaajan_finans-data:/d \
  #     --entrypoint python finans-agent:latest \
  #     -c "import sqlite3;c=sqlite3.connect('/d/finans_agent.db');c.execute('DELETE FROM scheduler_heartbeat');c.commit()"
  # Yoksa nabız ESKİ HOST'un adını taşır; konteyner zamanlayıcısı "başkası
  # çalışıyor" deyip çıkar ve nabız bayatlayana kadar (180 sn,
  # store/heartbeat.STALE_AFTER_SECONDS) yeniden başlar durur. Kendini
  # toparlar ama Docker Desktop'ta üç dakika "Restarting" görünür.
  finans-data:
