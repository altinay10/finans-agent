# ---------------------------------------------------------------------------
# AGENT ile kredi oranı — collectors/loan_rates_llm.py
#
# Bu bankalarda kullanılabilir bir uç nokta YOK; oran pazarlama sayfasında
# düz metin olarak yazıyor. Dört ayrı kırılgan parser yazmak yerine LLM ile
# çıkarılıyor. Modelin döndürdüğü her oran, sayfanın metninde GERÇEKTEN
# geçmek zorunda (zeminleme kontrolü) — uydurma bir oran veritabanına
# giremez.
#
# Erişilebilirlik 2026-08-26'da canlı doğrulandı; parantez içindekiler o gün
# sayfada görülen örnek oranlardır (kanıt amaçlı, koda gömülü DEĞİL).
#
# AGENT KAPALIYSA bu toplayıcı tek token harcamadan biter
# (.env: LLM_FALLBACK_ENABLED=1 + LLM_API_KEY gerekir).
# ---------------------------------------------------------------------------
loan_llm_endpoints:
  halkbank:
    url: "https://www.halkbank.com.tr/tr/bireysel/krediler/ihtiyac-kredileri/Avantajli-ihtiyac-kredisi"
    type: llm_html
    auth: none
    status: active
    institution: HALKBANK
    last_verified: 2026-08-26
    note: "Sayfa 200; metinde aylık oran geçiyor (ör. %4,19)."

  qnb:
    url: "https://www.qnb.com.tr/bireysel-ihtiyac-kredisi"
    type: llm_html
    auth: none
    status: active
    institution: QNB
    last_verified: 2026-08-26
    note: >
      Sayfa 200; hem aylık faiz (ör. %2,84 / %3,19) hem yıllık maliyet oranı
      (%68,64 / %71,24) yazıyor. Prompt açıkça "yıllık maliyet oranını ALMA"
      diyor; zeminleme kontrolü de yıllık oranın aylık sanılmasını
      yakalayamaz (o sayı da sayfada geçer), asıl koruma bant kontrolü:
      %20 üzeri aylık oran reddedilir.

  denizbank:
    url: "https://www.denizbank.com/krediler/bireysel-bankacilik/ihtiyac-kredisi"
    type: llm_html
    auth: none
    status: active
    institution: DENIZBANK
    last_verified: 2026-08-26
    note: "Sayfa 200; metinde aylık oran geçiyor (ör. %2,99)."

  ing:
    url: "https://www.ing.com.tr/tr/ihtiyac-kredisi"
    type: llm_html
    auth: none
    status: active
    institution: ING
    last_verified: 2026-08-26
    note: "Sayfa 200; metinde birden fazla kampanya oranı geçiyor (ör. %1,69 / %2,99 / %3,48)."

  teb:
    url: "https://www.teb.com.tr/ihtiyac-kredileri/"
    type: llm_html
    auth: none
    status: unverified
    institution: TEB
    last_verified: 2026-08-26
    blocked_reason: >
      Sayfa 200 ve erişilebilir ama düz metinde oran GÖRÜNMÜYOR (JS ile
      geliyor olabilir). Modele oransız bir sayfa göndermek token yakmaktır;
      oranın nerede yayınlandığı bulunana kadar kapalı.

  garantibbva:
    url: "https://www.garantibbva.com.tr/krediler/bireysel-ihtiyac-kredisi"
    type: llm_html
    auth: none
    status: unverified
    institution: GARANTIBBVA
    last_verified: 2026-08-26
    blocked_reason: "Sayfa 200 ama düz metinde oran yok — TEB ile aynı durum."

  isbank:
    url: "https://www.isbank.com.tr/ihtiyac-kredisi"
    type: llm_html
    auth: none
    status: blocked
    institution: ISBANK
    last_verified: 2026-08-26
    blocked_reason: >
      Sayfa HTTP 200 dönüyor ama içerik WAF engel sayfası ("İstek
      Engellenmiştir"). Bu robots.txt gibi bir nezaket kuralı DEĞİL, aktif
      bot tespiti; aşmak parmak izi taklidi gerektirir. Kullanıcının
      robots.txt kararı bunu kapsamıyor. Toplayıcı bu sayfayı modele
      GÖNDERMEZ — engel sayfası tespit edilip istek düşürülür.

  ziraat:
    status: unverified
    institution: ZIRAAT
    last_verified: 2026-08-26
    blocked_reason: >
      Kredi ürün sayfalarının doğru adresi bulunamadı (denenen yollar 404).
      Ana sayfada yalnızca başvuru formu bağlantıları var. Engel yok,
      araştırma yarım.

# ---------------------------------------------------------------------------
# Katılım bankası KÂR PAYLAŞIM oranları — collectors/profit_shares.py
#
# DİKKAT: buradaki sayılar yıllık getiri DEĞİL, bankanın elde ettiği kârın
# müşteriye düşen yüzdesidir (%93 = kârın %93'ü katılımcıya). Ayrı bir
# tabloda (profit_share_ratios) tutulur ve getiri hesabına ASLA sokulmaz.
# Bu bölüm envantere sonradan eklendi (2026-08-25): toplayıcı vardı ama
# kaynağı sources.yaml'da yazmıyordu — panelin "bu veri nereden geliyor"
# sorusunu cevaplayamamasının sebeplerinden biri buydu.
# ---------------------------------------------------------------------------
profit_share_endpoints:
  emlakkatilim:
    url: "https://www.emlakkatilim.com.tr/tr/bireysel/hesaplar/katilma-hesaplari/katilma-hesabi"
    type: html
    auth: none
    status: active
    institution: EMLAKKATILIM
    last_verified: 2026-08-24
    note: >
      Sunucu-render HTML tablo; bakiye kademesi x vade matrisi. Yayınlanan
      değer "Kar Paylaşım Oranı". Banka yıllık getiri oranı yayınlamıyor,
      bu yüzden mevduatla doğrudan kıyaslanamıyor (bkz. PLAN.md madde 2).

  kuveytturk:
    url: "https://www.kuveytturk.com.tr/"
    type: html
    auth: none
    status: active
    institution: KUVEYTTURK
    last_verified: 2026-08-24
    note: >
      "87-13" biçimindeki müşteri/banka payı ayrıştırılıyor; ilk sayı
      müşteriye düşen paydır. Emlak Katılım ile aynı sınır geçerli:
      bu bir yıllık getiri oranı değildir.

# ---------------------------------------------------------------------------
# Fon fiyat kaynakları — collectors/akportfoy.py (+ ileride başka sağlayıcılar)
# Fon LİSTESİ config/funds.yaml'da; burası yalnızca SAĞLAYICI envanteri.
# ---------------------------------------------------------------------------
fund_endpoints:
  akportfoy:
    url: "https://www.akportfoy.com.tr/tr/fon/{code}"
    type: html_embedded_json
    auth: none
    status: active
    last_verified: 2026-08-23
    note: >
      Tam geçmiş fiyat serisi sayfaya `var fundVals = {...}` olarak gömülü;
      API çağrısı, token veya CSRF yok. Sitede robots.txt YOK (HTTP 404).
      TUZAK: `Date` alanı epoch MİLİSANİYE ve İstanbul gece yarısına denk
      geliyor; UTC olarak yorumlanırsa tarihler bir gün geriye kayar.

  garantiportfoy:
    url: "https://www.garantibbvaportfoy.com.tr/webservice/fundsinddailyds"
    type: anon_token_json
    auth: anon_bearer
    status: active
    last_verified: 2026-08-25
    note: >
      Üç adımlı, login'siz akış: /webservice/gettoken (anonim bearer,
      client_id "garantiportfoy:frontend") -> /webservice/lastdate ->
      /webservice/fundsinddailyds. Belirteç bir KULLANICI kimliği değil,
      sitenin kendi ön yüzünün herkese açık istemci belirtecidir; VakıfBank
      akışıyla aynı desen. DİKKAT: dönen seri BİRİM PAY FİYATI DEĞİL,
      "1.000 TL yatırılsaydı" endeksidir; panel bunu açıkça yazar
      (collectors/fund_providers.py::GarantiPortfoyProvider).

  isportfoy:
    url: "https://www.isportfoy.com.tr/tr/yatirim-fonlari"
    type: html
    auth: none
    status: unverified
    last_verified: 2026-08-25
    blocked_reason: >
      Fon LİSTESİ okunabiliyor (kod + ad + sayfa adresi gömülü JSON olarak
      geliyor; TI2 = İş Portföy Hisse Senedi TL Fonu gibi). Ama GEÇMİŞ FİYAT
      SERİSİ uç noktası bulunamadı: fon detay sayfasında data-service-url ya
      da gömülü seri yok, ayrı bir "/getiri-ve-fiyatlar" sayfası var ve
      henüz incelenmedi. Engel yok, araştırma yarım — bir sonraki adım orası.

  tefas:
    url: "https://www.tefas.gov.tr/api/DB/BindHistoryInfo"
    type: json_post
    auth: none
    status: blocked
    last_verified: 2026-08-24
    blocked_reason: >
      F5 Shape/BIG-IP bot challenge (window["bobcmn"], /TSPD/,
      DOSL7.challenge.support_id). Eski API uç noktaları 404. Bunu aşmak
      obfuscated JS çalıştırıp çerez üretmek, yani BOT TESPİTİ ATLATMAK
      demektir. Kullanıcının robots.txt kararı bunu KAPSAMIYOR; İş Bankası
      WAF'ıyla aynı kategoride. Bilinçli olarak yapılmıyor.

