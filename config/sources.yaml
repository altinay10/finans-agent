      müşteriye düşen paydır. Emlak Katılım ile aynı sınır geçerli:
      bu bir yıllık getiri oranı değildir.

# ---------------------------------------------------------------------------
# Fon fiyat kaynakları — collectors/akportfoy.py (+ ileride başka sağlayıcılar)
# Fon LİSTESİ config/funds.yaml'da; burası yalnızca SAĞLAYICI envanteri.
# ---------------------------------------------------------------------------
fund_endpoints:
  akportfoy:
    url: "https://www.akportfoy.com.tr/tr/fon/{code}"
    type: html_embedded_json
    auth: none
    status: active
    last_verified: 2026-08-23
    note: >
      Tam geçmiş fiyat serisi sayfaya `var fundVals = {...}` olarak gömülü;
      API çağrısı, token veya CSRF yok. Sitede robots.txt YOK (HTTP 404).
      TUZAK: `Date` alanı epoch MİLİSANİYE ve İstanbul gece yarısına denk
      geliyor; UTC olarak yorumlanırsa tarihler bir gün geriye kayar.

  garantiportfoy:
    url: "https://www.garantibbvaportfoy.com.tr/webservice/fundsinddailyds"
    type: anon_token_json
    auth: anon_bearer
    status: active
    last_verified: 2026-08-25
    note: >
      Üç adımlı, login'siz akış: /webservice/gettoken (anonim bearer,
      client_id "garantiportfoy:frontend") -> /webservice/lastdate ->
      /webservice/fundsinddailyds. Belirteç bir KULLANICI kimliği değil,
      sitenin kendi ön yüzünün herkese açık istemci belirtecidir; VakıfBank
      akışıyla aynı desen. DİKKAT: dönen seri BİRİM PAY FİYATI DEĞİL,
      "1.000 TL yatırılsaydı" endeksidir; panel bunu açıkça yazar
      (collectors/fund_providers.py::GarantiPortfoyProvider).

  denizportfoy:
    url: "https://www.denizportfoy.com/Fon/FonGetiriList"
    type: json_query
    auth: none
    status: blocked
    last_verified: 2026-09-05
    blocked_reason: >
      ERİŞİM ENGELİ YOK — VERİ GÜVENİLİR DEĞİL. Uç nokta açık ve
      robots.txt de izin veriyor (`/api/` yasak, bu uç `/Fon/` altında);
      sorun verinin kendisinde.

      `?start=D&end=D` çağrısı "o günün birim pay fiyatı"nı veriyor
      GÖRÜNÜYOR: yanıt `sıra_ilkFiyat_sonFiyat_KOD_getiri_10000TL_birim`
      biçiminde ve start==end iken ilk=son, getiri 0 oluyor. Ama
      değerler o tarihe AİT DEĞİL.

      Kanıt (2026-09-05, hepsi ölçüldü):
        * 04.09.2026 tek gün sorgusu ile sitenin KENDİ fon tablosundaki
          güncel fiyat karşılaştırıldı: 90 fonun yalnızca 23'ü %2 içinde
          tutuyor. DLZ %180, DIK %64, DVT %27 sapıyor.
        * DLY bir PARA PİYASASI fonu, yani fiyatı düşemez. Uç nokta
          07.07 -> 5.792449, 06.08 -> 5.618543, 01.09 -> 4.820227 diyor
          (düşüyor), sonra 01-04 Eylül arası günde %3,2 "yükseliyor".
          İkisi de bu fon türü için imkânsız.
        * 10.07.2026 - 31.08.2026 arası neredeyse tüm günler `null` ya da
          `NaN` dönüyor; 06.08 tek başına dolu. Yani tarih ızgarası
          kurulamıyor.

      Yanıtta TARİH ALANI YOK; bir değerin hangi güne ait olduğu
      doğrulanamıyor. Bu veriyi seriye yazmak, fiyatları YANLIŞ TARİHE
      kaydetmek olurdu — hiçbir yerde patlamayan, panelde sessizce yanlış
      getiri gösteren türden bir hata. Bilerek kullanılmıyor.

      İLERİDE AÇILABİLİR: `/Fon/FonGetirileri` sayfasındaki tablo 93 fonun
      GÜNCEL fiyatını doğru veriyor (tek istek, ad + "(Hisse Senedi Yoğun
      Fon)" ibaresi dahil). Günlük anlık görüntü olarak toplanırsa ileriye
      doğru doğru bir seri kurar — ama geçmişi olmaz, yani İş Portföy ile
      aynı gerekçeyle bugün panele fayda etmez.

      DenizBank'ın KENDİ sitesinde fiyat verisi hiç yok: 2026-09-05'te
      `/kendim-icin/ozel-bankacilik/.../fon-fiyatlari` tarayıcıda açıldı,
      hiçbir veri isteği atmıyor; sayfa pazarlama içeriği.

  ykportfoy:
    url: "https://www.yapikrediportfoy.com.tr/getFundDetail/{id}"
    type: json_post
    auth: none
    status: active
    last_verified: 2026-09-05
    note: >
      113 fon (kilitli özel fonlar ve tasfiye edilenler çıkınca katalog 76).
      Üç adım: sitemap.xml -> fon sayfası -> POST /getFundDetail/<id>.
      Sayısal kimlik yalnızca sayfada (`data-ajax-fund-detail`), koddan
      türetilemiyor.
      DİKKAT — GET ÇALIŞMAZ, 404 HTML döner; yöntem POST olmak zorunda.
      Boş gövdeyle de 200 döner ama seri BOŞ gelir, yani "200 aldım demek
      ki çalışıyor" kontrolü burada yanıltıcıdır.
      DİKKAT — 30 GÜNDEN UZUN ARALIK SERİYİ AYLIĞA SEYRELTİR. Ölçüldü
      (2026-09-05, YUB): 28 gün -> 20 nokta, 31 gün -> 2 nokta, 90 gün ->
      4 nokta, 1095 gün -> 37 nokta. Bu yüzden toplayıcı uzun aralıktan
      aylık omurgayı, panelin senaryolarının denk geldiği yerlerden
      28 günlük pencerelerle günlük çözünürlüğü alıyor.
      DİKKAT — tarihler epoch değil, TÜRKÇE AY ADIYLA metin ("06 Eylül
      2024"); locale'e güvenmek sunucuda sessizce boş seri üretirdi.
      Yapı Kredi'nin KENDİ sitesi (`/yatirimci-kosesi/fon-bilgileri/`)
      42 fonu kod + ad + GÜNCEL fiyat olarak veriyor, geçmiş seri yok ve
      listesi zaten YK Portföy'ün alt kümesi — bu yüzden kullanılmıyor.

  isportfoy:
    url: "https://www.isportfoy.com.tr/tr/yatirim-fonlari"
    type: html
    auth: none
    status: blocked
    last_verified: 2026-09-04
    blocked_reason: >
      Araştırma tamamlandı — "bir sonraki adım" olarak işaretlenen
      /getiri-ve-fiyatlar sayfası 2026-09-04'te incelendi. Sayfa GÜNÜN
      fiyatını sunucu-render tablo olarak veriyor (fon kodu + tarih + birim
      pay fiyatı, ~100 fon) ama GEÇMİŞ SERİ YOK: fon detay sayfalarında da
      data-service-url, grafik ucu veya gömülü seri bulunmuyor.
      Panelin fon simülasyonu geçmiş seriyle çalışıyor (bkz.
      collectors/fund_providers.py); tek bir günlük fiyat, sıfır geçmişle
      başlayan ve aylarca kullanılamayacak bir fon kaydı üretirdi. Engel
      YOK — sağlayıcı geçmiş seri yayınlarsa açılabilir.

  tefas:
    url: "https://www.tefas.gov.tr/api/DB/BindHistoryInfo"
    type: json_post
    auth: none
    status: blocked
    last_verified: 2026-08-24
    blocked_reason: >
      F5 Shape/BIG-IP bot challenge (window["bobcmn"], /TSPD/,
      DOSL7.challenge.support_id). Eski API uç noktaları 404. Bunu aşmak
      obfuscated JS çalıştırıp çerez üretmek, yani BOT TESPİTİ ATLATMAK
      demektir. Kullanıcının robots.txt kararı bunu KAPSAMIYOR; İş Bankası
      WAF'ıyla aynı kategoride. Bilinçli olarak yapılmıyor.

evds:
  url: "https://evds2.tcmb.gov.tr/service/evds"
  auth: api_key
