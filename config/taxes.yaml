# Vergi ve kesinti oranları — tarih aralıklı.
#
# UYARI: Bu dosyadaki değerler taslaktır ve "DOĞRULA" notu taşıyanlar
# koda geçmeden önce birincil kaynaktan (Resmi Gazete / banka hesaplama
# aracı) teyit edilmelidir. Bkz. tasarım dokümanı §05.
#
# Her kalem valid_from tarihine göre azalan sırada tutulur; bir tarih için
# uygulanacak satır, o tarihten önceki veya o tarihe eşit en yakın valid_from'dur.

